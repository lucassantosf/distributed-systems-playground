services:
  postgres:
    image: postgres:17-alpine
    container_name: chat_postgres
    environment:
      POSTGRES_USER: chatuser
      POSTGRES_PASSWORD: chatpass
      POSTGRES_DB: chatdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatuser -d chatdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chat_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chat_backend
    ports:
      - "${CHAT_BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://chatuser:chatpass@postgres:5432/chatdb}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      APP_ENV: ${APP_ENV:-development}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-chat-backend}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      LOG_DIR: ${LOG_DIR:-/logs}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
      - ./logs:/logs
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - default
      - observability_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chat_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - node_modules:/app/node_modules
      - ./frontend:/app
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  postgres_data:
  node_modules:
  backend_venv:

networks:
  observability_network:
    external: true
    name: observability_network
