# =============================================================================
# 05 — Event Streaming Platform
# =============================================================================
# Serviços da plataforma:
#   - Apache Kafka (KRaft mode, sem Zookeeper)
#   - PostgreSQL  (um database por serviço: db_producer, db_notification, ...)
#   - Kafka UI    (visualização do ecossistema Kafka)
#   - Producer API            (FastAPI — Card 5)
#   - Notification Consumer   (confluent-kafka — Card 9)
#
# Ordem de inicialização garantida por healthchecks + depends_on:
#   postgres (healthy) → kafka (healthy) → producer-api (migrations + uvicorn)
#                                        → notification-consumer (migrations + loop)
#                                        → kafka-ui
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Apache Kafka — KRaft mode (broker + controller no mesmo nó)
  # Porta 9092  → comunicação interna entre containers (services)
  # Porta 29092 → acesso externo via localhost (curl, scripts, Kafka UI local)
  # ---------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.7.0
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      # ── KRaft: identidade do nó ──────────────────────────────────────────
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qg=="

      # ── Listeners ────────────────────────────────────────────────────────
      # PLAINTEXT       → interno Docker (kafka:9092)
      # PLAINTEXT_HOST  → externo host  (localhost:29092)
      # CONTROLLER      → eleição KRaft (kafka:9093)
      KAFKA_LISTENERS: "PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"

      # ── Configurações gerais ─────────────────────────────────────────────
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1        # cluster single-node
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0        # sem delay para dev
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"         # Tópicos gerenciados via scripts/create-topics.sh (Card 7)
      KAFKA_LOG_RETENTION_HOURS: 168                   # retenção padrão: 7 dias (Card 19)
      KAFKA_NUM_PARTITIONS: 3                          # padrão de partições (Card 10)
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # ---------------------------------------------------------------------------
  # PostgreSQL — um único container, um database por serviço
  # O script init.sql cria todos os databases na primeira inicialização
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Producer API — FastAPI que recebe pedidos e publica eventos no Kafka
  # Acesso: http://localhost:8000 | Docs: http://localhost:8000/docs
  # ---------------------------------------------------------------------------
  producer-api:
    build:
      context: ./producer-api
      dockerfile: Dockerfile
    container_name: producer-api
    ports:
      - "8000:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/db_producer
      PYTHONUNBUFFERED: "1"   # logs em tempo real no docker compose logs
    volumes:
      - ./shared:/app/shared   # shared/ montado como volume (Card 1: decisão de estratégia)
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: on-failure        # reinicia se o entrypoint falhar (ex.: migration race condition)
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s        # acomoda tempo de build de imagem + migrations + uvicorn warm-up

  # ---------------------------------------------------------------------------
  # Notification Consumer — Consome orders.created e envia e-mails (Card 9)
  # ---------------------------------------------------------------------------
  notification-consumer:
    build:
      context: ./consumers/notification-consumer
      dockerfile: Dockerfile
    container_name: notification-consumer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/db_notification
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./shared:/app/shared   # shared/ montado como volume
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: on-failure

  # ---------------------------------------------------------------------------
  # Kafka UI — visualização de Topics, Partitions, Consumer Groups e Offsets
  # Acesso: http://localhost:8080
  # ---------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

# =============================================================================
# Volumes persistentes
# =============================================================================
volumes:
  kafka-data:
  postgres-data:
