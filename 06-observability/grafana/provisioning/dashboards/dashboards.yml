# =============================================================================
# Grafana — Configuração de Providers de Dashboards (Provisioning)
# Preenchido no Card 10 (metrics), Card 11 (logs), Card 12 (traces)
# =============================================================================

apiVersion: 1

providers:
  - name: 'observability'
    orgId: 1
    folder: 'Observability'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
