# =============================================================================
# Filebeat — Coleta de Logs → Logstash
# Card 3: pipeline base
# Card 9: logs JSON estruturados com trace_id/span_id gerados pela sample-app
# =============================================================================

filebeat.inputs:
  # sample-app logs (Card 9)
  - type: log
    enabled: true
    paths:
      - /logs/sample-app/*.log
    close_inactive: 5s
    fields:
      env: development
      service: sample-app
    fields_under_root: true

  # Card 18.2 — producer-api logs
  - type: log
    enabled: true
    paths:
      - /logs/producer-api/*.log
    close_inactive: 5s
    fields:
      env: development
      service: producer-api
    fields_under_root: true

  # Projeto 02 — realtime-chat (Card 30)
  - type: log
    enabled: true
    paths:
      - /logs/chat-backend/*.log
    close_inactive: 5s
    fields:
      env: development
      service: chat-backend
    fields_under_root: true

# Envia os eventos para o Logstash (não diretamente ao OpenSearch)
output.logstash:
  hosts: ["logstash:5044"]

logging.level: info
logging.to_files: false
