# =============================================================================
# Logstash — Pipeline de Parse e Envio ao OpenSearch
# Card 3: pipeline base (beats → mutate → OpenSearch)
# Card 9: filtro json para logs estruturados com trace_id/span_id ✅
# =============================================================================

input {
  beats {
    port => 5044
  }
}

filter {
  # Remove metadados do Filebeat irrelevantes para análise
  mutate {
    remove_field => ["host", "agent", "ecs", "input"]
  }

  # Card 9: faz o parse do JSON emitido pela sample-app.
  # O json filter lê o campo "message" (JSON string) e expande suas chaves
  # como campos de nível raiz. Como o JSON contém "message", esse campo
  # é SOBRESCRITO com o texto do log — que é exatamente o que queremos.
  # NÃO removemos "message" pois após o parse ele já contém o texto legível.
  if [message] =~ /^\{/ {
    json {
      source => "message"
    }
  }
}

output {
  opensearch {
    hosts    => ["http://opensearch:9200"]
    index    => "observability-logs-%{+YYYY.MM.dd}"
    ssl      => false
  }

  stdout {
    codec => rubydebug
  }
}
