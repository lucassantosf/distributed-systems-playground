# =============================================================================
# Logstash — Pipeline de Parse e Envio ao OpenSearch
# Card 3: pipeline base (beats → mutate → OpenSearch)
# Card 9: filtro json para logs estruturados com trace_id/span_id ✅
# =============================================================================

input {
  # Recebe eventos do Filebeat via protocolo Beats
  beats {
    port => 5044
  }
}

filter {
  # Remove campos de metadados do Filebeat que não são relevantes
  mutate {
    remove_field => ["host", "agent", "ecs", "input"]
  }

  # Card 9: faz o parse do JSON emitido pela sample-app.
  # O campo "message" contém o JSON completo (ex: {"timestamp":...,"trace_id":...})
  # O filtro json expande esse JSON como campos de nível raiz do evento Logstash.
  if [message] =~ /^\{/ {
    json {
      source => "message"
    }

    # Remove o campo "message" original (já expandido como campos individuais)
    # para evitar duplicidade no OpenSearch
    mutate {
      remove_field => ["message"]
    }
  }
}

output {
  # Plugin nativo do OpenSearch — sem verificação de compatibilidade Elasticsearch
  # DISABLE_SECURITY_PLUGIN=true → HTTP puro, sem credenciais
  opensearch {
    hosts    => ["http://opensearch:9200"]
    index    => "observability-logs-%{+YYYY.MM.dd}"
    ssl      => false
  }

  # Imprime cada evento no stdout para facilitar debug durante desenvolvimento
  stdout {
    codec => rubydebug
  }
}
