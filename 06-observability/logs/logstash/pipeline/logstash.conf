# =============================================================================
# Logstash — Pipeline de Parse e Envio ao OpenSearch
# Card 3: pipeline base (beats → mutate → OpenSearch)
# Card 9: filtro json para logs estruturados com trace_id/span_id ✅
# =============================================================================

input {
  beats {
    port => 5044
  }
}

filter {
  # Remove metadados do Filebeat irrelevantes para análise
  mutate {
    remove_field => ["host", "agent", "ecs", "input"]
  }

  # Projeto 02: o índice já usa event como objeto ECS. Parsear o chat em um
  # namespace temporário evita conflito entre event (string do app) e event.name.
  if [service] == "chat-backend" and [message] =~ /^\{/ {
    json {
      source => "message"
      target => "chat_log"
    }

    mutate {
      remove_field => ["message", "chat_log"]
      rename => {
        "[chat_log][message]" => "message"
        "[chat_log][event]" => "[event][name]"
        "[chat_log][timestamp]" => "timestamp"
        "[chat_log][level]" => "level"
        "[chat_log][service]" => "service"
        "[chat_log][environment]" => "environment"
        "[chat_log][trace_id]" => "trace_id"
        "[chat_log][span_id]" => "span_id"
        "[chat_log][room]" => "room"
        "[chat_log][username]" => "username"
        "[chat_log][message_id]" => "message_id"
        "[chat_log][content]" => "content"
        "[chat_log][created_at]" => "created_at"
      }
    }
  } else if [message] =~ /^\{/ {
    # Card 9: parse dos logs JSON da sample-app e producer-api.
    json {
      source => "message"
    }
  }
}

output {
  opensearch {
    hosts    => ["http://opensearch:9200"]
    index    => "observability-logs-%{+YYYY.MM.dd}"
    ssl      => false
  }

  stdout {
    codec => rubydebug
  }
}
