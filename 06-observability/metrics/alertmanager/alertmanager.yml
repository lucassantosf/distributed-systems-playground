# =============================================================================
# Alertmanager — Configuração de Receivers e Rotas
# Card 14: Alertmanager configurado com rotas curtas para teste de alertas
# =============================================================================

global:
  resolve_timeout: 1m

route:
  group_by: ['alertname', 'job']
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'default-receiver'

receivers:
  - name: 'default-receiver'
    webhook_configs:
      - url: 'http://localhost:9093/'
        send_resolved: true

inhibit_rules: []
