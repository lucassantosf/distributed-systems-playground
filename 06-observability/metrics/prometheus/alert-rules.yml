# =============================================================================
# Prometheus — Regras de Alerta
# Card 14: ServiceDown, HighErrorRate e HighLatency
# =============================================================================

groups:
  - name: sample-app-alerts
    rules:
      - alert: ServiceDown
        expr: up{job="sample-app"} == 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Instância {{ $labels.instance }} está fora do ar"
          description: "O target {{ $labels.job }} ({{ $labels.instance }}) está inacessível."

      - alert: HighErrorRate
        expr: (sum(rate(http_requests_total{job="sample-app", status=~"5.."}[1m])) / sum(rate(http_requests_total{job="sample-app"}[1m]))) > 0.05
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Alta taxa de erros 5xx na sample-app"
          description: "A taxa de erros HTTP 5xx está acima de 5% (valor atual: {{ $value }})."

      - alert: HighLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="sample-app"}[1m]))) > 0.5
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Alta latência P95 na sample-app"
          description: "A latência P95 está acima de 500ms (valor atual: {{ $value }}s)."

  - name: chat-backend-alerts
    rules:
      - alert: ChatBackendDown
        expr: up{job="chat-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Backend do realtime-chat está fora do ar"
          description: "O target {{ $labels.instance }} não responde ao endpoint /metrics."

      - alert: ChatHighErrorRate
        expr: |
          (
            sum(rate(chat_http_requests_total{job="chat-backend", status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(chat_http_requests_total{job="chat-backend"}[5m])), 1)
          ) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Alta taxa de erros HTTP no realtime-chat"
          description: "Mais de 5% dos requests HTTP retornaram erro 5xx nos últimos 5 minutos."

      - alert: ChatHighHttpLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(chat_http_request_duration_seconds_bucket{job="chat-backend"}[5m]))
          ) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Alta latência HTTP no realtime-chat"
          description: "A latência P95 do backend está acima de 500ms."

      - alert: ChatHeartbeatTimeouts
        expr: increase(chat_heartbeat_timeouts_total{job="chat-backend"}[10m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Timeout de heartbeat no realtime-chat"
          description: "Uma ou mais conexões WebSocket foram removidas por falta de heartbeat nos últimos 10 minutos."
