# =============================================================================
# OpenTelemetry Collector — Receivers, Processors, Exporters
# Preenchido no Card 4
# =============================================================================

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  # Card 4: exportar traces para o Grafana Tempo
  otlp/tempo:
    endpoint: ""
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
