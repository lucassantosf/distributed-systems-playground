services:

  bff:
    build:
      context: ./bff
    container_name: bff
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - user-service
      - product-service
      - order-service
    networks:
      - bff-net

  user-service:
    build:
      context: ./services/user-service
    container_name: user-service
    ports:
      - "8001:8001"
    networks:
      - bff-net

  product-service:
    build:
      context: ./services/product-service
    container_name: product-service
    ports:
      - "8002:8002"
    networks:
      - bff-net

  order-service:
    build:
      context: ./services/order-service
    container_name: order-service
    ports:
      - "8003:8003"
    networks:
      - bff-net

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    ports:
      - "5173:5173"
    depends_on:
      - bff
    networks:
      - bff-net

networks:
  bff-net:
    driver: bridge
