services:

  postgres:
    image: postgres:16
    container_name: keycloak-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - keycloak-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak
    # start-dev habilita modo desenvolvimento (sem TLS, logs verbosos)
    # --import-realm importa o realm-export.json automaticamente no startup (Card 3)
    command: start-dev --import-realm
    environment:
      # Admin do Keycloak
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Banco de dados
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Habilita endpoints de health e métricas
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      # Evita warnings de proxy reverso no modo dev
      KC_PROXY: edge
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    ports:
      - "8080:8080"
    volumes:
      # Realm exportado é importado automaticamente via --import-realm (Card 3)
      - ./keycloak:/opt/keycloak/data/import
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - keycloak-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  # ── Samples serão adicionados aqui conforme cada Epic for implementado ──────
  # api-simples   → Epic 2 (Card 5)
  # frontend-pkce → Epic 3 (Card 10)
  # bff + docs-service → Epic 4 (Card 18)

networks:
  keycloak-net:
    driver: bridge

volumes:
  postgres_data:
