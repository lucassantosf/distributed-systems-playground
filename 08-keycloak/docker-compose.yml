services:

  postgres:
    image: postgres:16
    container_name: keycloak-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - keycloak-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak
    # start-dev habilita modo desenvolvimento (sem TLS, logs verbosos)
    # --import-realm importa o realm-export.json automaticamente no startup (Card 3)
    command: start-dev --import-realm
    environment:
      # Admin do Keycloak
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Banco de dados
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Habilita endpoints de health e métricas
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      # Evita warnings de proxy reverso no modo dev
      KC_PROXY: edge
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    ports:
      - "8080:8080"
    volumes:
      # Realm exportado é importado automaticamente via --import-realm (Card 3)
      - ./keycloak:/opt/keycloak/data/import
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - keycloak-net
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 && grep -q 'UP' <&3"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  api-simples:
    build:
      context: ./samples/api-simples
    container_name: api-simples
    ports:
      - "8001:8001"
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      REALM: distributed-systems
    volumes:
      - ./samples/api-simples/app:/app/app
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - keycloak-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  frontend-pkce:
    build:
      context: ./samples/frontend-pkce
    container_name: frontend-pkce
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://api-simples:8001
    volumes:
      - ./samples/frontend-pkce/src:/app/src
    depends_on:
      - api-simples
    networks:
      - keycloak-net

  # ── Epic 4 — Sample C: BFF + M2M ──────────────────
  bff:
    build:
      context: ./samples/bff-m2m/bff
    container_name: bff
    ports:
      - "8002:8002"
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ISSUER_URL: http://localhost:8080
      REALM: distributed-systems
      CLIENT_ID: bff-client
      CLIENT_SECRET: NdZZhMqZmZcsQhsvUequiwpWCLXD2urt
      DOCS_SERVICE_URL: http://docs-service:8003
    volumes:
      - ./samples/bff-m2m/bff/app:/app/app
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - keycloak-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  docs-service:
    build:
      context: ./samples/bff-m2m/docs-service
    container_name: docs-service
    ports:
      - "8003:8003"
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      # Todos os tokens emitidos pelo Keycloak têm iss=http://localhost:8080,
      # independentemente de como foram solicitados (via keycloak:8080 ou localhost:8080).
      # O isolamento M2M é feito pelo claim azp (Authorized Party = bff-client).
      KEYCLOAK_ISSUER_URL: http://localhost:8080
      REALM: distributed-systems
      EXPECTED_CLIENT_ID: bff-client
    volumes:
      - ./samples/bff-m2m/docs-service/app:/app/app
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - keycloak-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  keycloak-net:
    driver: bridge

volumes:
  postgres_data:
